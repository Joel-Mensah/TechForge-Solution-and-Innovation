<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tf-orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#E64A00" />
    </linearGradient>
    <filter id="tf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circuit Top Nodes -->
  <g fill="none" stroke="url(#tf-orange-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top node lines -->
    <path d="M 250 110 L 250 60" />
    <circle cx="250" cy="55" r="7" fill="#FF5500" />

    <path d="M 230 110 L 210 75 L 185 75" />
    <circle cx="180" cy="75" r="6" fill="#FF5500" />

    <path d="M 270 110 L 290 75 L 315 75" />
    <circle cx="320" cy="75" r="6" fill="#FF5500" />

    <path d="M 220 110 L 175 100" />
    <circle cx="170" cy="100" r="5" fill="#FF5500" />

    <path d="M 280 110 L 325 100" />
    <circle cx="330" cy="100" r="5" fill="#FF5500" />

    <path d="M 250 80 L 280 50" />
    <circle cx="285" cy="45" r="5" fill="#FF5500" />
    
    <path d="M 250 80 L 220 50" />
    <circle cx="215" cy="45" r="5" fill="#FF5500" />
  </g>

  <!-- TF Lettermark Structure -->
  <g fill="url(#tf-orange-grad)" filter="url(#tf-glow)">
    <!-- Top Horizontal T Bar -->
    <rect x="150" y="115" width="200" height="28" rx="6" />
    <!-- Inner TF cuts -->
    <rect x="175" y="148" width="150" height="24" rx="4" />
    
    <!-- Vertical Stem -->
    <rect x="236" y="175" width="28" height="110" rx="4" />
    
    <!-- F Middle Bar -->
    <rect x="264" y="200" width="60" height="22" rx="4" />
  </g>

  <!-- Organic Roots Base -->
  <g fill="none" stroke="url(#tf-orange-grad)" stroke-width="3.5" stroke-linecap="round">
    <path d="M 250 285 Q 240 310 210 330 Q 190 340 160 355" />
    <path d="M 245 285 Q 230 320 190 350 Q 170 365 140 370" />
    <path d="M 250 285 L 250 350 Q 250 370 240 385" />
    <path d="M 255 285 Q 270 320 310 350 Q 330 365 360 370" />
    <path d="M 250 285 Q 260 310 290 330 Q 310 340 340 355" />
    <path d="M 235 320 Q 210 350 185 375" />
    <path d="M 265 320 Q 290 350 315 375" />
  </g>
</svg>
