<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="video-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg-grad-2)"/>
  
  <!-- Video Suite Workspace -->
  <rect x="80" y="50" width="640" height="400" rx="16" fill="#141724" stroke="rgba(255,85,0,0.3)" stroke-width="2"/>
  <!-- Video Preview Screen -->
  <rect x="110" y="80" width="400" height="230" rx="8" fill="#0A0B10"/>
  <!-- Play Button overlay -->
  <circle cx="310" cy="195" r="35" fill="url(#video-glow)" opacity="0.9"/>
  <polygon points="302,180 326,195 302,210" fill="#FFFFFF"/>
  
  <!-- Editing Timeline Bar -->
  <rect x="110" y="330" width="580" height="90" rx="8" fill="#0E1017"/>
  <!-- Tracks -->
  <rect x="130" y="345" width="220" height="24" rx="4" fill="#FF5500" opacity="0.8"/>
  <rect x="360" y="345" width="180" height="24" rx="4" fill="#FF8800" opacity="0.6"/>
  <rect x="130" y="380" width="380" height="24" rx="4" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Playhead line -->
  <line x1="280" y1="320" x2="280" y2="420" stroke="#FF5500" stroke-width="3"/>
  <polygon points="274,320 286,320 280,328" fill="#FF5500"/>
</svg>
