<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="wd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A10"/>
      <stop offset="50%" stop-color="#0E121E"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="wd-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="wd-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <linearGradient id="code-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow-shadow">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#FF5500" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#wd-bg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Main IDE / Browser Window Frame -->
  <g filter="url(#glow-shadow)" transform="translate(40, 30)">
    <rect width="720" height="440" rx="14" fill="#0D0F17" stroke="rgba(255,85,0,0.4)" stroke-width="1.5"/>
    
    <!-- Window Title Bar -->
    <path d="M 0 14 Q 0 0 14 0 L 706 0 Q 720 0 720 14 L 720 42 L 0 42 Z" fill="#141724" stroke-bottom="rgba(255,255,255,0.05)"/>
    <circle cx="24" cy="21" r="5.5" fill="#FF5F56"/>
    <circle cx="42" cy="21" r="5.5" fill="#FFBD2E"/>
    <circle cx="60" cy="21" r="5.5" fill="#27C93F"/>
    
    <!-- Tab items -->
    <rect x="90" y="8" width="160" height="34" rx="6" fill="#0D0F17"/>
    <text x="110" y="30" fill="#FF7733" font-family="Outfit, sans-serif" font-weight="600" font-size="12">App.tsx — TechForge</text>
    
    <rect x="256" y="8" width="140" height="34" rx="6" fill="transparent"/>
    <text x="276" y="30" fill="#64647A" font-family="Outfit, sans-serif" font-weight="500" font-size="12">global.css</text>

    <!-- Sidebar Bar -->
    <rect x="0" y="42" width="55" height="398" fill="#10121C"/>
    <circle cx="27" cy="70" r="12" fill="url(#wd-orange)"/>
    <text x="27" y="74" fill="#FFF" font-family="Outfit" font-weight="800" font-size="11" text-anchor="middle">TF</text>
    
    <rect x="18" y="110" width="18" height="18" rx="4" fill="rgba(255,85,0,0.2)" stroke="#FF5500" stroke-width="1"/>
    <rect x="18" y="145" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>
    <rect x="18" y="180" width="18" height="18" rx="4" fill="rgba(255,255,255,0.05)"/>

    <!-- Left Code Editor View -->
    <rect x="55" y="42" width="310" height="398" fill="#0B0C12"/>
    <line x1="365" y1="42" x2="365" y2="440" stroke="rgba(255,255,255,0.06)"/>
    
    <!-- Code Lines Mockup -->
    <g font-family="Courier, monospace" font-size="11">
      <text x="75" y="75" fill="#64647A">1</text>
      <text x="95" y="75" fill="#FF5500">import</text>
      <text x="142" y="75" fill="#FFF"> { React } </text>
      <text x="205" y="75" fill="#FF5500">from</text>
      <text x="240" y="75" fill="#9E9EB3">'react'</text>

      <text x="75" y="98" fill="#64647A">2</text>
      <text x="95" y="98" fill="#FF5500">export default function</text>
      <text x="235" y="98" fill="#FFD000">App</text>
      <text x="260" y="98" fill="#FFF">() {</text>

      <text x="75" y="121" fill="#64647A">3</text>
      <text x="110" y="121" fill="#FF5500">return</text>
      <text x="155" y="121" fill="#FFF"> (</text>

      <text x="75" y="144" fill="#64647A">4</text>
      <rect x="120" y="132" width="225" height="20" fill="url(#code-accent)"/>
      <text x="125" y="144" fill="#00E5FF">&lt;div</text>
      <text x="160" y="144" fill="#FF7733">className</text>
      <text x="225" y="144" fill="#FFF">=</text>
      <text x="235" y="144" fill="#76FF03">"techforge-ui"</text>
      <text x="325" y="144" fill="#00E5FF">&gt;</text>

      <text x="75" y="167" fill="#64647A">5</text>
      <text x="140" y="167" fill="#00E5FF">&lt;Header</text>
      <text x="195" y="167" fill="#FF7733">title</text>
      <text x="230" y="167" fill="#FFF">=</text>
      <text x="240" y="167" fill="#76FF03">"TechForge"</text>
      <text x="320" y="167" fill="#00E5FF">/&gt;</text>

      <text x="75" y="190" fill="#64647A">6</text>
      <text x="140" y="190" fill="#00E5FF">&lt;HeroSection</text>
      <text x="235" y="190" fill="#FF7733">status</text>
      <text x="280" y="190" fill="#FFF">=</text>
      <text x="290" y="190" fill="#76FF03">"Live"</text>

      <text x="75" y="213" fill="#64647A">7</text>
      <text x="155" y="213" fill="#FF7733">speed</text>
      <text x="195" y="213" fill="#FFF">=</text>
      <text x="205" y="213" fill="#FFD000">{99.9}</text>
      <text x="250" y="213" fill="#00E5FF">/&gt;</text>

      <text x="75" y="236" fill="#64647A">8</text>
      <text x="140" y="236" fill="#00E5FF">&lt;InteractiveGrid</text>

      <text x="75" y="259" fill="#64647A">9</text>
      <text x="155" y="259" fill="#FF7733">theme</text>
      <text x="195" y="259" fill="#FFF">=</text>
      <text x="205" y="259" fill="#76FF03">"DarkFuturistic"</text>

      <text x="75" y="282" fill="#64647A">10</text>
      <text x="140" y="282" fill="#00E5FF">/&gt;</text>

      <text x="75" y="305" fill="#64647A">11</text>
      <text x="125" y="305" fill="#00E5FF">&lt;/div&gt;</text>

      <text x="75" y="328" fill="#64647A">12</text>
      <text x="110" y="328" fill="#FFF">);</text>

      <text x="75" y="351" fill="#64647A">13</text>
      <text x="95" y="351" fill="#FFF">}</text>
    </g>

    <!-- Terminal Output -->
    <rect x="55" y="365" width="310" height="75" fill="#06070B"/>
    <text x="70" y="385" fill="#76FF03" font-family="Courier, monospace" font-size="10">✓ Compiled successfully in 120ms</text>
    <text x="70" y="405" fill="#9E9EB3" font-family="Courier, monospace" font-size="10">▲ Local:   http://localhost:8080/</text>
    <text x="70" y="423" fill="#FF5500" font-family="Courier, monospace" font-size="10">▶ Build: Ready for Deployment</text>

    <!-- Right Live Web App Preview -->
    <rect x="365" y="42" width="355" height="398" fill="#0F121D"/>
    
    <!-- Live Header bar -->
    <rect x="385" y="60" width="315" height="35" rx="6" fill="#181B2B" stroke="rgba(255,85,0,0.2)"/>
    <rect x="400" y="72" width="60" height="10" rx="5" fill="url(#wd-orange)"/>
    <rect x="580" y="70" width="40" height="15" rx="7.5" fill="rgba(255,255,255,0.1)"/>
    <rect x="630" y="70" width="55" height="15" rx="7.5" fill="url(#wd-orange)"/>

    <!-- Hero Card Mockup -->
    <rect x="385" y="108" width="315" height="130" rx="10" fill="url(#wd-glass)" stroke="rgba(255,85,0,0.3)"/>
    <rect x="405" y="125" width="180" height="14" rx="4" fill="#FFFFFF"/>
    <rect x="405" y="148" width="240" height="8" rx="4" fill="#9E9EB3"/>
    <rect x="405" y="162" width="160" height="8" rx="4" fill="#64647A"/>
    
    <!-- CTA Button on preview -->
    <rect x="405" y="185" width="90" height="26" rx="13" fill="url(#wd-orange)"/>
    <rect x="505" y="185" width="90" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,85,0,0.4)"/>

    <!-- Analytics Chart Component Mockup -->
    <rect x="385" y="250" width="150" height="170" rx="10" fill="#141726" stroke="rgba(255,255,255,0.05)"/>
    <text x="400" y="275" fill="#FFF" font-family="Outfit" font-weight="700" font-size="12">Performance</text>
    <path d="M 400 370 Q 430 340 450 350 T 490 300 T 520 290" fill="none" stroke="#FF5500" stroke-width="3"/>
    <circle cx="520" cy="290" r="4" fill="#FFF" stroke="#FF5500" stroke-width="2"/>

    <!-- Mobile Device Preview Mockup -->
    <g transform="translate(550, 250)">
      <rect width="150" height="170" rx="12" fill="#0A0C12" stroke="#FF5500" stroke-width="1.5"/>
      <rect x="10" y="12" width="130" height="146" rx="8" fill="#121522"/>
      <rect x="20" y="25" width="70" height="8" rx="4" fill="#FFF"/>
      <rect x="20" y="40" width="110" height="50" rx="6" fill="rgba(255,85,0,0.15)"/>
      <rect x="20" y="100" width="110" height="22" rx="11" fill="url(#wd-orange)"/>
    </g>

  </g>
</svg>
