<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="100%" stop-color="#111320"/>
    </linearGradient>
    <linearGradient id="gd-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E63900"/>
    </linearGradient>
    <linearGradient id="gd-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1F35"/>
      <stop offset="100%" stop-color="#0C0E18"/>
    </linearGradient>
    <linearGradient id="gd-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="brand-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E32"/>
      <stop offset="100%" stop-color="#0D0F1C"/>
    </linearGradient>
    <filter id="gd-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#FF5500" flood-opacity="0.25"/>
    </filter>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <pattern id="gd-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <clipPath id="app-clip">
      <rect width="800" height="500" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#gd-bg)"/>
  <rect width="800" height="500" fill="url(#gd-grid)"/>

  <!-- Ambient glow top-right -->
  <ellipse cx="680" cy="80" rx="180" ry="80" fill="#FF5500" opacity="0.04"/>
  <!-- Ambient glow bottom-left -->
  <ellipse cx="120" cy="430" rx="140" ry="60" fill="#FF8C00" opacity="0.05"/>

  <!-- ===== APP WINDOW ===== -->
  <g filter="url(#gd-shadow)">
    <rect x="20" y="20" width="760" height="460" rx="12" fill="#0D0F1A" stroke="rgba(255,100,0,0.3)" stroke-width="1.5"/>
  </g>

  <!-- Title bar -->
  <rect x="20" y="20" width="760" height="36" rx="12" fill="#13162A"/>
  <rect x="20" y="44" width="760" height="12" fill="#13162A"/>
  <!-- Window dots -->
  <circle cx="44" cy="38" r="5.5" fill="#FF5F56"/>
  <circle cx="62" cy="38" r="5.5" fill="#FFBD2E"/>
  <circle cx="80" cy="38" r="5.5" fill="#28C840"/>
  <!-- Window title -->
  <text x="400" y="43" fill="#5A5A78" font-family="'Outfit',sans-serif" font-size="11" font-weight="600" text-anchor="middle">TechForge — Brand Identity Studio · Vector Artboard v2.4</text>

  <!-- ===== LEFT TOOLBAR ===== -->
  <rect x="20" y="56" width="48" height="424" fill="#0B0D18"/>
  <!-- Toolbar separator -->
  <line x1="68" y1="56" x2="68" y2="480" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Tool: Select (active) -->
  <rect x="28" y="70" width="32" height="32" rx="7" fill="url(#gd-orange)"/>
  <text x="44" y="91" fill="#FFF" font-family="sans-serif" font-size="14" text-anchor="middle">↖</text>

  <!-- Tool: Pen -->
  <rect x="28" y="110" width="32" height="32" rx="7" fill="rgba(255,255,255,0.05)"/>
  <path d="M44 118 L38 133 L40 135 L50 124 Z" fill="#7878A0"/>

  <!-- Tool: Shape -->
  <rect x="28" y="150" width="32" height="32" rx="7" fill="rgba(255,255,255,0.05)"/>
  <rect x="36" y="158" width="16" height="16" rx="2" fill="none" stroke="#7878A0" stroke-width="2"/>

  <!-- Tool: Text -->
  <rect x="28" y="190" width="32" height="32" rx="7" fill="rgba(255,255,255,0.05)"/>
  <text x="44" y="212" fill="#7878A0" font-family="'Outfit',sans-serif" font-weight="800" font-size="15" text-anchor="middle">T</text>

  <!-- Tool: Color -->
  <rect x="28" y="230" width="32" height="32" rx="7" fill="rgba(255,255,255,0.05)"/>
  <circle cx="44" cy="246" r="7" fill="#FF5500"/>

  <!-- Divider -->
  <line x1="30" y1="275" x2="58" y2="275" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Tool: Zoom -->
  <rect x="28" y="283" width="32" height="32" rx="7" fill="rgba(255,255,255,0.05)"/>
  <circle cx="42" cy="297" r="5" fill="none" stroke="#7878A0" stroke-width="2"/>
  <line x1="46" y1="301" x2="51" y2="306" stroke="#7878A0" stroke-width="2"/>

  <!-- ===== ARTBOARD CANVAS ===== -->
  <rect x="68" y="56" width="530" height="424" fill="#07080E"/>
  <!-- Ruler top -->
  <rect x="68" y="56" width="530" height="16" fill="#0F1120"/>
  <!-- Ruler left -->
  <rect x="68" y="72" width="18" height="408" fill="#0F1120"/>

  <!-- Ruler ticks top -->
  <g stroke="rgba(255,255,255,0.15)" stroke-width="1">
    <line x1="140" y1="56" x2="140" y2="66"/>
    <line x1="220" y1="56" x2="220" y2="63"/>
    <line x1="300" y1="56" x2="300" y2="66"/>
    <line x1="380" y1="56" x2="380" y2="63"/>
    <line x1="460" y1="56" x2="460" y2="66"/>
    <line x1="540" y1="56" x2="540" y2="63"/>
  </g>
  <g fill="rgba(255,255,255,0.25)" font-family="monospace" font-size="8">
    <text x="138" y="63">200</text>
    <text x="298" y="63">400</text>
    <text x="458" y="63">600</text>
  </g>

  <!-- Guide lines -->
  <line x1="86" y1="72" x2="598" y2="72" stroke="rgba(0,220,255,0.2)" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="86" y1="72" x2="86" y2="480" stroke="rgba(0,220,255,0.2)" stroke-width="1" stroke-dasharray="5 5"/>
  <line x1="330" y1="72" x2="330" y2="480" stroke="rgba(0,220,255,0.15)" stroke-width="1" stroke-dasharray="4 6"/>
  <line x1="86" y1="270" x2="598" y2="270" stroke="rgba(0,220,255,0.15)" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- ===== BRAND IDENTITY CARD ON ARTBOARD ===== -->
  <g filter="url(#card-shadow)">
    <rect x="110" y="90" width="290" height="185" rx="14" fill="url(#brand-card-grad)" stroke="rgba(255,100,0,0.5)" stroke-width="1.5"/>
  </g>

  <!-- Card: orange top accent bar -->
  <rect x="110" y="90" width="290" height="5" rx="3" fill="url(#gd-orange)"/>
  <rect x="110" y="93" width="290" height="2" fill="url(#gd-orange)" opacity="0.5"/>

  <!-- Card: Logo mark circle -->
  <circle cx="148" cy="130" r="22" fill="url(#gd-orange)"/>
  <text x="148" y="136" fill="#FFF" font-family="'Outfit',sans-serif" font-weight="900" font-size="15" text-anchor="middle">TF</text>
  <!-- Circuit dot accent on circle -->
  <circle cx="162" cy="112" r="3" fill="#FFF" opacity="0.7"/>
  <line x1="162" y1="112" x2="168" y2="106" stroke="#FF8C00" stroke-width="1.2"/>
  <circle cx="168" cy="106" r="2" fill="#FF8C00"/>

  <!-- Card: Brand name text -->
  <text x="180" y="122" fill="#FFFFFF" font-family="'Outfit',sans-serif" font-weight="800" font-size="20" letter-spacing="0.5">TechForge</text>
  <text x="180" y="137" fill="#FF7733" font-family="'Outfit',sans-serif" font-weight="600" font-size="8" letter-spacing="2.5">SOLUTIONS · INNOVATION</text>

  <!-- Card: Thin separator -->
  <line x1="125" y1="163" x2="385" y2="163" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Card: Tagline -->
  <text x="255" y="183" fill="#9090B0" font-family="'Inter',sans-serif" font-size="10" text-anchor="middle">Forging Digital Excellence Through Innovation</text>

  <!-- Card: Bezier vector path artwork -->
  <path d="M 125 240 C 175 205, 230 255, 280 215 S 360 200, 390 215" fill="none" stroke="#FF5500" stroke-width="2.5"/>
  <circle cx="125" cy="240" r="5" fill="#FFF" stroke="#FF5500" stroke-width="2"/>
  <line x1="125" y1="240" x2="155" y2="218" stroke="#00CFFF" stroke-width="1.3"/>
  <circle cx="155" cy="218" r="3.5" fill="#00CFFF"/>
  <circle cx="280" cy="215" r="5" fill="#FFF" stroke="#FF5500" stroke-width="2"/>
  <line x1="280" y1="215" x2="255" y2="232" stroke="#00CFFF" stroke-width="1.3"/>
  <circle cx="255" cy="232" r="3.5" fill="#00CFFF"/>
  <circle cx="390" cy="215" r="5" fill="#FF5500" stroke="#FFF" stroke-width="2"/>

  <!-- Card: color swatches -->
  <g>
    <circle cx="137" cy="253" r="9" fill="#FF5500"/>
    <circle cx="160" cy="253" r="9" fill="#FF8800"/>
    <circle cx="183" cy="253" r="9" fill="#FFBB00"/>
    <circle cx="206" cy="253" r="9" fill="#00CFFF"/>
    <circle cx="229" cy="253" r="9" fill="#FFFFFF"/>
    <circle cx="252" cy="253" r="9" fill="#1A1E35"/>
    <circle cx="252" cy="253" r="9" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  <text x="272" y="257" fill="#5A5A78" font-family="'Inter',sans-serif" font-size="9">Brand Palette</text>

  <!-- ===== TYPOGRAPHY CARD ===== -->
  <g filter="url(#card-shadow)">
    <rect x="415" y="90" width="165" height="185" rx="12" fill="#10132050" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  </g>
  <rect x="415" y="90" width="165" height="185" rx="12" fill="url(#gd-card)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  <text x="430" y="115" fill="#7878A0" font-family="'Outfit',sans-serif" font-size="9" font-weight="600" letter-spacing="1.5">TYPOGRAPHY</text>
  <line x1="430" y1="122" x2="568" y2="122" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Font specimens -->
  <text x="430" y="148" fill="#FFFFFF" font-family="'Outfit',sans-serif" font-weight="800" font-size="24">Outfit</text>
  <text x="430" y="164" fill="#FF7733" font-family="'Outfit',sans-serif" font-size="9">Display / Headings</text>

  <text x="430" y="190" fill="#D0D0E8" font-family="'Inter',sans-serif" font-weight="400" font-size="16">Inter</text>
  <text x="430" y="206" fill="#5A5A78" font-family="'Inter',sans-serif" font-size="9">Body / UI Text</text>

  <line x1="430" y1="215" x2="568" y2="215" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Weight scale -->
  <text x="430" y="232" fill="#3A3A58" font-family="'Outfit',sans-serif" font-size="10" font-weight="300">Light</text>
  <text x="465" y="232" fill="#7878A0" font-family="'Outfit',sans-serif" font-size="10" font-weight="400">Regular</text>
  <text x="520" y="232" fill="#C0C0D8" font-family="'Outfit',sans-serif" font-size="10" font-weight="700">Bold</text>
  <line x1="430" y1="240" x2="568" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Approved badge -->
  <rect x="430" y="248" width="72" height="18" rx="9" fill="url(#gd-orange)"/>
  <text x="466" y="261" fill="#FFF" font-family="'Outfit',sans-serif" font-weight="700" font-size="9" text-anchor="middle">✓ APPROVED</text>

  <!-- ===== LOGO VARIANTS ROW ===== -->
  <g>
    <!-- Variant 1: Dark bg -->
    <rect x="110" y="300" width="100" height="60" rx="8" fill="#08090E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="140" cy="326" r="12" fill="url(#gd-orange)"/>
    <text x="140" y="331" fill="#FFF" font-family="'Outfit',sans-serif" font-weight="900" font-size="9" text-anchor="middle">TF</text>
    <text x="160" y="323" fill="#FFF" font-family="'Outfit',sans-serif" font-weight="800" font-size="10">TechForge</text>
    <text x="160" y="335" fill="#FF7733" font-family="'Outfit',sans-serif" font-size="6" letter-spacing="1">SOLUTIONS</text>
    <text x="140" y="352" fill="#5A5A78" font-family="'Inter',sans-serif" font-size="7" text-anchor="middle">Dark Version</text>

    <!-- Variant 2: Light bg -->
    <rect x="222" y="300" width="100" height="60" rx="8" fill="#F5F5F7" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
    <circle cx="252" cy="326" r="12" fill="url(#gd-orange)"/>
    <text x="252" y="331" fill="#FFF" font-family="'Outfit',sans-serif" font-weight="900" font-size="9" text-anchor="middle">TF</text>
    <text x="272" y="323" fill="#111" font-family="'Outfit',sans-serif" font-weight="800" font-size="10">TechForge</text>
    <text x="272" y="335" fill="#E64A00" font-family="'Outfit',sans-serif" font-size="6" letter-spacing="1">SOLUTIONS</text>
    <text x="252" y="352" fill="#888" font-family="'Inter',sans-serif" font-size="7" text-anchor="middle">Light Version</text>

    <!-- Variant 3: Monochrome -->
    <rect x="334" y="300" width="100" height="60" rx="8" fill="#1A1D2E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="364" cy="326" r="12" fill="none" stroke="#FFF" stroke-width="2"/>
    <text x="364" y="331" fill="#FFF" font-family="'Outfit',sans-serif" font-weight="900" font-size="9" text-anchor="middle">TF</text>
    <text x="384" y="323" fill="#FFF" font-family="'Outfit',sans-serif" font-weight="800" font-size="10">TechForge</text>
    <text x="384" y="335" fill="#AAA" font-family="'Outfit',sans-serif" font-size="6" letter-spacing="1">SOLUTIONS</text>
    <text x="364" y="352" fill="#5A5A78" font-family="'Inter',sans-serif" font-size="7" text-anchor="middle">Mono Version</text>

    <!-- Variant 4: Icon only -->
    <rect x="446" y="300" width="60" height="60" rx="8" fill="#08090E" stroke="rgba(255,100,0,0.3)" stroke-width="1"/>
    <circle cx="476" cy="326" r="16" fill="url(#gd-orange)"/>
    <text x="476" y="331" fill="#FFF" font-family="'Outfit',sans-serif" font-weight="900" font-size="13" text-anchor="middle">TF</text>
    <text x="476" y="352" fill="#5A5A78" font-family="'Inter',sans-serif" font-size="7" text-anchor="middle">Icon Mark</text>
  </g>

  <!-- ===== STATUS BAR BOTTOM ===== -->
  <rect x="68" y="460" width="530" height="20" fill="#0D0F1A"/>
  <text x="86" y="474" fill="#3A3A58" font-family="'Inter',sans-serif" font-size="9">Artboard: 1920 × 1080px · RGB Color · 300 dpi</text>
  <text x="540" y="474" fill="#FF5500" font-family="'Inter',sans-serif" font-size="9" text-anchor="end">Zoom: 72%</text>

  <!-- ===== RIGHT PANEL ===== -->
  <rect x="598" y="56" width="182" height="424" fill="#0B0D18"/>
  <line x1="598" y1="56" x2="598" y2="480" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Panel: tabs -->
  <rect x="598" y="56" width="182" height="30" fill="#0F1120"/>
  <rect x="598" y="56" width="61" height="30" fill="#13162A"/>
  <text x="629" y="76" fill="#FF7733" font-family="'Outfit',sans-serif" font-size="10" font-weight="700" text-anchor="middle">Inspect</text>
  <text x="690" y="76" fill="#5A5A78" font-family="'Outfit',sans-serif" font-size="10" text-anchor="middle">Layers</text>
  <text x="750" y="76" fill="#5A5A78" font-family="'Outfit',sans-serif" font-size="10" text-anchor="middle">Assets</text>

  <!-- Panel: section label -->
  <text x="615" y="108" fill="#464660" font-family="'Outfit',sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">FILL &amp; STROKE</text>
  <rect x="615" y="116" width="28" height="28" rx="6" fill="#FF5500"/>
  <rect x="648" y="116" width="28" height="28" rx="6" fill="#FF8800"/>
  <rect x="681" y="116" width="28" height="28" rx="6" fill="#00CFFF"/>
  <rect x="714" y="116" width="28" height="28" rx="6" fill="#FFFFFF"/>
  <text x="615" y="160" fill="#464660" font-family="'Outfit',sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">OPACITY</text>
  <!-- Opacity slider -->
  <rect x="615" y="167" width="148" height="6" rx="3" fill="#1A1E35"/>
  <rect x="615" y="167" width="118" height="6" rx="3" fill="url(#gd-accent)"/>
  <circle cx="733" cy="170" r="6" fill="#FFF" stroke="#FF5500" stroke-width="2"/>
  <text x="763" y="174" fill="#FF7733" font-family="'Inter',sans-serif" font-size="9">80%</text>

  <!-- Layers -->
  <text x="615" y="198" fill="#464660" font-family="'Outfit',sans-serif" font-size="9" font-weight="700" letter-spacing="1.2">LAYERS</text>
  <!-- Layer rows -->
  <rect x="608" y="206" width="164" height="26" rx="5" fill="rgba(255,85,0,0.15)" stroke="#FF5500" stroke-width="1"/>
  <text x="622" y="224" fill="#FFFFFF" font-family="'Inter',sans-serif" font-size="10">❖  Brand Logo Group</text>

  <rect x="608" y="238" width="164" height="26" rx="5" fill="rgba(255,255,255,0.03)"/>
  <text x="622" y="256" fill="#9090B0" font-family="'Inter',sans-serif" font-size="10">✦  Typography System</text>

  <rect x="608" y="270" width="164" height="26" rx="5" fill="rgba(255,255,255,0.03)"/>
  <text x="622" y="288" fill="#9090B0" font-family="'Inter',sans-serif" font-size="10">▬  Color Palette</text>

  <rect x="608" y="302" width="164" height="26" rx="5" fill="rgba(255,255,255,0.03)"/>
  <text x="622" y="320" fill="#9090B0" font-family="'Inter',sans-serif" font-size="10">◼  Background Mesh</text>

  <rect x="608" y="334" width="164" height="26" rx="5" fill="rgba(255,255,255,0.03)"/>
  <text x="622" y="352" fill="#9090B0" font-family="'Inter',sans-serif" font-size="10">●  Logo Variants</text>

  <!-- Export button -->
  <rect x="615" y="430" width="148" height="34" rx="8" fill="url(#gd-orange)"/>
  <text x="689" y="452" fill="#FFF" font-family="'Outfit',sans-serif" font-weight="700" font-size="12" text-anchor="middle">⬇ Export Assets</text>

  <!-- Label tag bottom-left -->
  <rect x="25" y="450" width="38" height="14" rx="4" fill="url(#gd-orange)" opacity="0.9"/>
  <text x="44" y="461" fill="#FFF" font-family="'Outfit',sans-serif" font-size="7" font-weight="700" text-anchor="middle">DESIGN</text>
</svg>
