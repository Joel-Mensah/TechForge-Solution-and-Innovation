<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B10"/>
      <stop offset="50%" stop-color="#121420"/>
      <stop offset="100%" stop-color="#06070B"/>
    </linearGradient>
    <linearGradient id="gd-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="card-3d-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2235"/>
      <stop offset="100%" stop-color="#0E101A"/>
    </linearGradient>
    <filter id="gd-glow">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#FF5500" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#gd-bg)"/>

  <!-- Canvas Grid Background -->
  <g stroke="rgba(255,255,255,0.025)" stroke-width="1">
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none"/>
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <rect width="100%" height="100%" fill="url(#grid-pattern)"/>
  </g>

  <!-- Main Design Studio Workspace Window -->
  <g filter="url(#gd-glow)" transform="translate(40, 30)">
    <rect width="720" height="440" rx="14" fill="#0E1018" stroke="rgba(255,85,0,0.4)" stroke-width="1.5"/>

    <!-- Window Top Header -->
    <path d="M 0 14 Q 0 0 14 0 L 706 0 Q 720 0 720 14 L 720 40 L 0 40 Z" fill="#141724"/>
    <circle cx="24" cy="20" r="5.5" fill="#FF5F56"/>
    <circle cx="42" cy="20" r="5.5" fill="#FFBD2E"/>
    <circle cx="60" cy="20" r="5.5" fill="#27C93F"/>
    
    <text x="360" y="25" fill="#9E9EB3" font-family="Outfit, sans-serif" font-weight="600" font-size="12" text-anchor="middle">TechForge — Graphic Studio Suite (Vector 3D Artboard)</text>

    <!-- Left Toolbar -->
    <rect x="0" y="40" width="50" height="400" fill="#10121C"/>
    
    <!-- Active Tool Icons -->
    <rect x="10" y="55" width="30" height="30" rx="6" fill="url(#gd-orange)"/>
    <!-- Pen Tool Icon -->
    <path d="M 27 63 L 20 75 L 22 77 L 31 67 Z" fill="#FFFFFF"/>
    
    <rect x="10" y="95" width="30" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
    <circle cx="25" cy="110" r="7" fill="none" stroke="#9E9EB3" stroke-width="2"/>
    
    <rect x="10" y="135" width="30" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
    <rect x="19" y="144" width="12" height="12" fill="none" stroke="#9E9EB3" stroke-width="2"/>

    <rect x="10" y="175" width="30" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
    <text x="25" y="195" fill="#9E9EB3" font-family="Outfit" font-weight="800" font-size="14" text-anchor="middle">T</text>

    <rect x="10" y="215" width="30" height="30" rx="6" fill="rgba(255,255,255,0.04)"/>
    <circle cx="25" cy="230" r="5" fill="#FF5500"/>

    <!-- Center Artboard Workspace -->
    <!-- Artboard Canvas -->
    <rect x="80" y="60" width="460" height="350" fill="#08090E" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Ruler Guides -->
    <line x1="80" y1="160" x2="540" y2="160" stroke="rgba(0,229,255,0.3)" stroke-dasharray="4 4"/>
    <line x1="280" y1="60" x2="280" y2="410" stroke="rgba(0,229,255,0.3)" stroke-dasharray="4 4"/>

    <!-- 3D Brand Card Mockup Artwork in Perspective -->
    <g transform="translate(140, 100)">
      <!-- Main Floating Brand Card -->
      <rect width="280" height="170" rx="14" fill="url(#card-3d-grad)" stroke="url(#gd-orange)" stroke-width="2" filter="url(#gd-glow)"/>
      
      <!-- Logo Circuit Node Artwork on Card -->
      <g transform="translate(40, 30)">
        <circle cx="30" cy="20" r="14" fill="url(#gd-orange)"/>
        <text x="30" y="25" fill="#FFF" font-family="Outfit" font-weight="900" font-size="14" text-anchor="middle">TF</text>

        <text x="55" y="20" fill="#FFFFFF" font-family="Outfit, sans-serif" font-weight="800" font-size="18">TechForge</text>
        <text x="55" y="32" fill="#FF7733" font-family="Outfit, sans-serif" font-weight="700" font-size="8" letter-spacing="2">SOLUTIONS - INNOVATION</text>
      </g>

      <!-- Vector Bezier Curve Lines & Node Handles overlay -->
      <path d="M 20 130 C 70 80, 160 170, 260 120" fill="none" stroke="#FF5500" stroke-width="2.5"/>
      <path d="M 20 130 L 50 110" stroke="#00E5FF" stroke-width="1.5"/>
      <path d="M 260 120 L 230 140" stroke="#00E5FF" stroke-width="1.5"/>
      <circle cx="20" cy="130" r="4.5" fill="#FFF" stroke="#FF5500" stroke-width="2"/>
      <circle cx="50" cy="110" r="3.5" fill="#00E5FF"/>
      <circle cx="260" cy="120" r="4.5" fill="#FFF" stroke="#FF5500" stroke-width="2"/>
      <circle cx="230" cy="140" r="3.5" fill="#00E5FF"/>

      <!-- Vector Color Swatches Pills -->
      <rect x="30" y="115" width="16" height="16" rx="8" fill="#FF5500"/>
      <rect x="52" y="115" width="16" height="16" rx="8" fill="#FF8800"/>
      <rect x="74" y="115" width="16" height="16" rx="8" fill="#00E5FF"/>
      <rect x="96" y="115" width="16" height="16" rx="8" fill="#FFFFFF"/>
    </g>

    <!-- Floating Graphic Design Specimen Card Below -->
    <g transform="translate(180, 290)">
      <rect width="200" height="90" rx="10" fill="#141724" stroke="rgba(255,255,255,0.1)"/>
      <text x="15" y="28" fill="#FFF" font-family="Outfit" font-weight="700" font-size="13">3D Identity System</text>
      <text x="15" y="48" fill="#9E9EB3" font-family="Inter" font-size="10">CMYK / RGB Vector Export</text>
      <rect x="15" y="60" width="80" height="18" rx="9" fill="url(#gd-orange)"/>
      <text x="55" y="73" fill="#FFF" font-family="Outfit" font-weight="700" font-size="9" text-anchor="middle">APPROVED</text>
    </g>

    <!-- Right Inspector / Layers Panel -->
    <rect x="560" y="40" width="160" height="400" fill="#10121C"/>
    <text x="575" y="65" fill="#FFF" font-family="Outfit" font-weight="700" font-size="13">Inspector</text>
    
    <rect x="575" y="80" width="130" height="1" fill="rgba(255,255,255,0.08)"/>

    <text x="575" y="100" fill="#64647A" font-family="Outfit" font-size="10" font-weight="600">COLOR PALETTE</text>
    <rect x="575" y="110" width="30" height="30" rx="6" fill="#FF5500"/>
    <rect x="610" y="110" width="30" height="30" rx="6" fill="#FF8800"/>
    <rect x="645" y="110" width="30" height="30" rx="6" fill="#00E5FF"/>

    <text x="575" y="165" fill="#64647A" font-family="Outfit" font-size="10" font-weight="600">LAYERS & COMPOSITES</text>

    <!-- Layer Items -->
    <rect x="575" y="180" width="130" height="28" rx="4" fill="rgba(255,85,0,0.2)" stroke="#FF5500" stroke-width="1"/>
    <text x="590" y="198" fill="#FFF" font-family="Inter" font-size="11">❖ Brand Logo Vector</text>

    <rect x="575" y="215" width="130" height="28" rx="4" fill="rgba(255,255,255,0.03)"/>
    <text x="590" y="233" fill="#9E9EB3" font-family="Inter" font-size="11">✦ Typography Grid</text>

    <rect x="575" y="250" width="130" height="28" rx="4" fill="rgba(255,255,255,0.03)"/>
    <text x="590" y="268" fill="#9E9EB3" font-family="Inter" font-size="11">◼ 3D Shadow Backdrop</text>

    <rect x="575" y="285" width="130" height="28" rx="4" fill="rgba(255,255,255,0.03)"/>
    <text x="590" y="303" fill="#9E9EB3" font-family="Inter" font-size="11">● Gradient Mesh</text>

  </g>
</svg>
