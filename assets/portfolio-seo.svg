  <rect x="16" y="16" width="768" height="44" rx="14" fill="#10132060"/>
  <rect x="16" y="16" width="768" height="44" rx="0" fill="#10132080"/>
  <rect x="16" y="44" width="768" height="16" fill="#10132080"/>

