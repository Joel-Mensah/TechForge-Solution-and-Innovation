  <text x="310" y="43" fill="#5A5A78" font-family="'Outfit',sans-serif" font-size="10" text-anchor="middle">Keywords</text>
  <text x="390" y="43" fill="#5A5A78" font-family="'Outfit',sans-serif" font-size="10" text-anchor="middle">Backlinks</text>
