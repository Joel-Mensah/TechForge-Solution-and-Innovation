<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="seo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D"/>
      <stop offset="100%" stop-color="#111420"/>
    </linearGradient>
    <linearGradient id="seo-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E63900"/>
    </linearGradient>
    <linearGradient id="seo-chart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="seo-chart2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00CFFF" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="kw-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="kw-bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00CFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00CFFF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="seo-glow">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#FF5500" flood-opacity="0.2"/>
    </filter>
    <filter id="panel-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <pattern id="seo-grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M 35 0 L 0 0 0 35" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
